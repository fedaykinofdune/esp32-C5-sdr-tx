# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
# No IP traffic: the network stack only carries the Wi-Fi driver, minimal (as osmosdr_serial):
# the C5's RAM below its capture bank is tight.
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_ESP_SDR=y

# Gapless ring through the modem diagnostic bus and loop replay through the DAC engine.
CONFIG_ESP_SDR_DIAG=y
CONFIG_ESP_SDR_REPLAY=y

CONFIG_BASE64=y
CONFIG_CRC=y
# No logging: the RAM goes to the shell buffers below.
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=2048

# The shell on USB-Serial-JTAG, shaped for a program at the other end (web/, which turns the
# echo off): no colours, a fixed prompt that ends every reply, and lines long enough for a
# waveform chunk ("wave put <offset> <base64 of 192 words>").
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_PROMPT_UART="sdr> "
CONFIG_SHELL_CMD_BUFF_SIZE=1152
CONFIG_SHELL_PRINTF_BUFF_SIZE=128
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1280
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_WILDCARD=n
