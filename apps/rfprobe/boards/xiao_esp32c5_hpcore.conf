# Seeed XIAO ESP32-C5: the U.FL connector is the only RF port, no switch to set.

# Gapless ring through the modem diagnostic bus: probe diag. It drives GPIO 0, 1, 3, 4, 5,
# 7, 10 and 23 (D1, D0, D3, D10, D4 and three unrouted pads) while it runs.
CONFIG_ESP_SDR_DIAG=y

# Loop replay through the DAC engine: probe tx.
CONFIG_ESP_SDR_REPLAY=y
